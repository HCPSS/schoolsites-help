site_name: HCPSS School Sites Documentation
theme:
  features:
    - navigation.expand
  name: material
  icon:
    tag:
      new: material/new-box
      updated: material/update
markdown_extensions:
  - admonition
  - def_list
  - attr_list
  - toc:
      permalink: "#"
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - tags
  - mkdocs-video:
      is_video: True
      video_autoplay: False
      video_loop: True
      video_muted: True
      css_style:
        width: "100%"
        height: "32vw"
nav:
  - index.md
  - Foundational Concepts:
    - accessibility.md
    - tips-and-best-practices.md
  - Getting Started:
    - logging-in.md
    - finding-content.md
    - using-the-rich-text-editor.md
    - tagging-content.md
    - Cloning Content: clone-content.md
  #- content-model.md
  - Creating and Managing Content:
    - News: creating-and-editing-news-messages.md
    - Events: creating-and-editing-events.md
    - Staff Lists: creating-and-managing-staff-lists.md
    - resources.md
    - Media: adding-and-managing-media.md
    - Homepage Highlights: managing-homepage-highlights.md
    - advanced-pages.md

    #- Newsletters: creating-newsletter.md

    #- adding-hcpss-content.md
    #- adding-content-from-another-school.md
  - faq.md
extra_css:
  - stylesheets/extra.css
extra:
  tags:
    New: new
    Updated: updated
